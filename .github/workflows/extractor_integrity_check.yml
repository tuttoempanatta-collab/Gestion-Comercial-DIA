name: Auditoría e Integridad del Extractor DIA

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  extractor-integrity-test:
    name: Test de Integridad y Protección de RAM (19 Reglas)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        working-directory: backend
        run: npm ci || npm install

      - name: Ejecutar Suite de Integridad del Extractor y Árbitro de RAM
        working-directory: backend
        run: npm test
